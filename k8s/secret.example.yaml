# ★ 範本檔：示範 Secret 結構，不含真實值，可安全進版控。
#
# 實際部署時「不要」把填好的 Secret 提交到 repo。改用下列任一方式：
#   kubectl create secret generic appeal-workbench-secret \
#     --namespace appeal-workbench \
#     --from-literal=BEDROCK_KB_ID=<你的KB_ID>
# 或使用 Sealed Secrets / External Secrets Operator 等機制。
#
# AWS 存取金鑰「不」放這裡。正式環境請用 IRSA（IAM Roles for Service Accounts），
# 讓 Pod 透過 ServiceAccount 取得臨時憑證，符合「憑證不落地」原則。
apiVersion: v1
kind: Secret
metadata:
  name: appeal-workbench-secret
  namespace: appeal-workbench
  labels:
    app.kubernetes.io/name: appeal-workbench
type: Opaque
stringData:
  # Bedrock Knowledge Base ID（RAG 檢索）。未設定會靜默回 mock。
  BEDROCK_KB_ID: "REPLACE_ME"
